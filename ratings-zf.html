<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>تقييم بنك TIMSS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700&display=swap">
<style>
:root{--bg:#f6f8fb;--card:#fff;--tx:#1b2733;--mu:#5b6b7a;--ac:#0b6e99;--bd:#d9e1e8;--star:#f5b301;--track:#e9eef3;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171d;--card:#18222b;--tx:#e8eef3;--mu:#9fb0bf;--ac:#5cc0e8;--bd:#2c3a46;--star:#f5b301;--track:#24313c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10171d;--card:#18222b;--tx:#e8eef3;--mu:#9fb0bf;--ac:#5cc0e8;--bd:#2c3a46;--star:#f5b301;--track:#24313c;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",sans-serif;line-height:1.6}
main{max-width:640px;margin:auto;padding:24px 16px 40px}
h1{font-family:"Noto Kufi Arabic","Segoe UI",Tahoma,sans-serif;font-size:1.5rem;margin:0}
.sub{color:var(--mu);font-size:.9rem;margin:2px 0 18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px}
.kpi .l{color:var(--mu);font-size:.85rem}
.kpi .v{font-family:"Noto Kufi Arabic","Segoe UI",Tahoma,sans-serif;font-size:1.9rem;font-weight:700;line-height:1.3;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:.95rem;color:var(--mu);font-weight:500}
.kpi .h{color:var(--mu);font-size:.8rem}
#avgStars{color:var(--star);letter-spacing:1px}
h2{font-size:1rem;margin:0 0 10px}
.row{display:grid;grid-template-columns:4.5rem 1fr 6.5rem;gap:10px;align-items:center;margin:8px 0;font-variant-numeric:tabular-nums}
.row .s{color:var(--star);letter-spacing:-1px;white-space:nowrap;direction:ltr;text-align:end}
.track{height:12px;background:var(--track);border-radius:6px;overflow:hidden}
.fill{height:100%;background:var(--star);border-radius:6px;min-width:0}
.row .n{font-size:.9rem}.row .n span{color:var(--mu)}
.vis{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-variant-numeric:tabular-nums}
.vis span:nth-child(even){font-weight:600}
.note{color:var(--mu);font-size:.85rem}
.err{border-color:#c2410c}
button{font:inherit;color:var(--ac);background:none;border:1px solid var(--bd);border-radius:8px;padding:6px 12px;cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>
</head>
<body>
<main>
<h1>تقييم بنك أسئلة TIMSS</h1>
<p class="sub">صفحة خاصة بكِ، غير مرتبطة بالموقع · <span id="upd">جارٍ التحميل…</span></p>

<div class="kpis">
  <div class="kpi"><div class="l">متوسط التقييم</div><div class="v" id="avg">—</div><div class="h" id="avgStars"></div></div>
  <div class="kpi"><div class="l">نسبة الرضا (٤–٥ نجوم)</div><div class="v" id="sat">—</div><div class="h" id="satH"></div></div>
  <div class="kpi"><div class="l">عدد المقيِّمات</div><div class="v" id="nr">—</div><div class="h" id="nrH"></div></div>
</div>

<div class="card">
  <h2>توزيع التقييمات</h2>
  <div id="dist"></div>
</div>

<div class="card">
  <h2>الزيارات</h2>
  <div class="vis" id="vis"></div>
</div>

<div class="card note" id="msg" hidden></div>
<p class="note">الأرقام تأتي من GoatCounter وتتحدّث عند فتح الصفحة. <button type="button" id="again">تحديث</button></p>
</main>
<script>
const GC='https://zahraafalah.goatcounter.com/counter/';
const AR=n=>n.toLocaleString('ar-EG',{maximumFractionDigits:1});
const PCT=n=>AR(Math.round(n))+'٪';
const $=s=>document.querySelector(s);
// Missing paths return 404 = no counts yet; anything else unreadable is a real failure.
async function get(path){
  const r=await fetch(GC+encodeURIComponent(path)+'.json',{cache:'no-store'});
  if(r.status===404)return 0;
  if(!r.ok)throw new Error(r.status);
  const j=await r.json();return +String(j.count).replace(/[^\d]/g,'')||0;
}
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
async function load(){
  $('#msg').hidden=true;$('#upd').textContent='جارٍ التحميل…';
  try{
    const paths=['rating-1','rating-2','rating-3','rating-4','rating-5','TOTAL','/sci7','/sci8','/math7','/math8'];
    const v=await Promise.all(paths.map(get));
    const r=v.slice(0,5),total=v[5],sub=v.slice(6);
    const n=r.reduce((a,b)=>a+b,0);
    const avg=n?r.reduce((a,c,i)=>a+c*(i+1),0)/n:0;
    $('#avg').innerHTML=n?AR(avg)+' <small>من ٥</small>':'—';
    $('#avgStars').textContent=n?'★'.repeat(Math.round(avg))+'☆'.repeat(5-Math.round(avg)):'لا توجد تقييمات بعد';
    $('#sat').textContent=n?PCT((r[3]+r[4])/n*100):'—';
    $('#satH').textContent=n?AR(r[3]+r[4])+' من '+AR(n):'';
    $('#nr').textContent=AR(n);
    $('#nrH').textContent=total?PCT(Math.min(100,n/total*100))+' من الزائرات ('+AR(total)+')':'';
    const d=$('#dist');d.replaceChildren();
    for(let i=4;i>=0;i--){
      const p=n?r[i]/n*100:0,row=el('div','row');
      const t=el('div','track'),f=el('div','fill');f.style.width=p+'%';t.append(f);
      const c=el('div','n',PCT(p)+' ');c.append(el('span','','('+AR(r[i])+')'));
      row.append(el('div','s','★'.repeat(i+1)),t,c);
      row.setAttribute('aria-label',(i+1)+' نجوم: '+Math.round(p)+'٪، '+r[i]);
      d.append(row);
    }
    const vis=$('#vis');vis.replaceChildren();
    [['إجمالي زائرات الموقع',total],['علوم – الصف السابع',sub[0]],['علوم – الصف الثامن',sub[1]],['رياضيات – الصف السابع',sub[2]],['رياضيات – الصف الثامن',sub[3]]]
      .forEach(([l,x])=>vis.append(el('span','',l),el('span','',AR(x))));
    $('#upd').textContent='آخر تحديث '+new Date().toLocaleTimeString('ar-EG',{hour:'numeric',minute:'2-digit'});
  }catch(e){
    $('#upd').textContent='تعذّر التحميل';
    const m=$('#msg');m.hidden=false;m.classList.add('err');
    m.textContent='تعذّر قراءة الأرقام من GoatCounter. تأكدي من تفعيل الخيار: Settings ← Allow adding visitor counts on your website، ثم اضغطي Save وحدّثي الصفحة.';
  }
}
$('#again').onclick=load;load();
</script>
</body>
</html>
